<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StayFinder — Test Runner</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #222; padding: 32px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .summary { font-size: 1rem; margin-bottom: 24px; padding: 12px 18px; border-radius: 8px; font-weight: 600; }
    .pass-summary { background: #e6f4ea; color: #1e7e34; }
    .fail-summary { background: #fce8e6; color: #c5221f; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    th { background: #1a73e8; color: #fff; padding: 10px 14px; text-align: left; font-size: 0.85rem; }
    td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .pass { color: #1e7e34; font-weight: 700; }
    .fail { color: #c5221f; font-weight: 700; }
    .detail { font-size: 0.78rem; color: #888; margin-top: 4px; }
  </style>
</head>
<body>

<h1>StayFinder — Unit Test Runner</h1>
<div id="summary" class="summary"></div>
<table>
  <thead>
    <tr><th>#</th><th>Test Case</th><th>Result</th><th>Detail</th></tr>
  </thead>
  <tbody id="results"></tbody>
</table>

<script>
  // ── Pure function under test (copied from index.html — DD-04) ──────────────
  // SYNC NOTE: if filterProperties logic changes in index.html, update this copy too.
  function filterProperties(props, state) {
    const { amenities, types, minScore } = state;
    return props.filter(p => {
      const safeAmenities = p.amenities || [];
      const safeType      = p.type      || "";
      const safeScore     = p.score     || 0;
      const amenityMatch  = amenities.length === 0 || amenities.some(a => safeAmenities.includes(a));
      const typeMatch     = types.length === 0     || types.includes(safeType);
      const scoreMatch    = safeScore >= minScore;
      return amenityMatch && typeMatch && scoreMatch;
    });
  }

  // ── Mock data (mirrors index.html properties[]) ───────────────────────────
  const properties = [
    { id: 1,  name: "The Grand Horizon Hotel", type: "hotel", amenities: ["wifi", "breakfast"], score: 9.2, price: 180 },
    { id: 2,  name: "Sunset Villa Retreat",    type: "villa", amenities: ["wifi", "breakfast"], score: 9.5, price: 320 },
    { id: 3,  name: "City Centre Inn",         type: "hotel", amenities: ["wifi"],              score: 7.8, price: 95  },
    { id: 4,  name: "Palm Grove Villa",        type: "villa", amenities: ["breakfast"],         score: 8.4, price: 275 },
    { id: 5,  name: "Blue Bay Hotel",          type: "hotel", amenities: ["wifi", "breakfast"], score: 8.9, price: 145 },
    { id: 6,  name: "Mountain View Lodge",     type: "hotel", amenities: [],                    score: 6.5, price: 75  },
    { id: 7,  name: "Coastal Dream Villa",     type: "villa", amenities: ["wifi"],              score: 9.0, price: 410 },
    { id: 8,  name: "Downtown Express Hotel",  type: "hotel", amenities: ["wifi"],              score: 7.2, price: 110 },
    { id: 9,  name: "Garden Escape Villa",     type: "villa", amenities: ["wifi", "breakfast"], score: 8.1, price: 230 },
    { id: 10, name: "The Heritage Hotel",      type: "hotel", amenities: ["breakfast"],         score: 8.6, price: 160 },
  ];

  // ── Test helpers ──────────────────────────────────────────────────────────
  const noFilter = { amenities: [], types: [], minScore: 1 };

  function assert(description, condition, detail) {
    return { description, pass: condition, detail: detail || "" };
  }

  function ids(results) {
    return results.map(p => p.id).sort((a, b) => a - b);
  }

  // ── Test cases ────────────────────────────────────────────────────────────
  const tests = [

    // T01 — Happy path: no filters returns all 10 (FR-5 / AC-5)
    assert(
      "No filters → all 10 properties returned",
      filterProperties(properties, noFilter).length === 10,
      "Expected 10, all filters off"
    ),

    // T02 — Amenity: wifi only (FR-1)
    assert(
      "Amenity = wifi → only wifi properties",
      (() => {
        const r = filterProperties(properties, { ...noFilter, amenities: ["wifi"] });
        return r.every(p => p.amenities.includes("wifi")) && r.length === 7;
      })(),
      "IDs with wifi: 1,2,3,5,7,8,9 → 7 properties"
    ),

    // T03 — Amenity: breakfast only (FR-1)
    assert(
      "Amenity = breakfast → only breakfast properties",
      (() => {
        const r = filterProperties(properties, { ...noFilter, amenities: ["breakfast"] });
        return r.every(p => p.amenities.includes("breakfast")) && r.length === 6;
      })(),
      "IDs with breakfast: 1,2,4,5,9,10 → 6 properties"
    ),

    // T04 — Amenity OR logic: wifi + breakfast = union (FR-1 OR logic)
    assert(
      "Amenity = wifi + breakfast → union (OR logic)",
      filterProperties(properties, { ...noFilter, amenities: ["wifi", "breakfast"] }).length === 9,
      "All except Mountain View Lodge (id=6, no amenities) → 9 properties"
    ),

    // T05 — Type: hotel only (FR-2)
    assert(
      "Type = hotel → only hotels",
      (() => {
        const r = filterProperties(properties, { ...noFilter, types: ["hotel"] });
        return r.every(p => p.type === "hotel") && r.length === 6;
      })(),
      "Hotel IDs: 1,3,5,6,8,10 → 6 properties"
    ),

    // T06 — Type: villa only (FR-2)
    assert(
      "Type = villa → only villas",
      (() => {
        const r = filterProperties(properties, { ...noFilter, types: ["villa"] });
        return r.every(p => p.type === "villa") && r.length === 4;
      })(),
      "Villa IDs: 2,4,7,9 → 4 properties"
    ),

    // T07 — Type OR logic: hotel + villa = all (FR-2 OR logic)
    assert(
      "Type = hotel + villa → all 10 (OR logic)",
      filterProperties(properties, { ...noFilter, types: ["hotel", "villa"] }).length === 10,
      "All types selected = no type filter applied"
    ),

    // T08 — Score filter: min 9.0 (FR-3)
    assert(
      "Min score = 9.0 → only high-rated properties",
      (() => {
        const r = filterProperties(properties, { ...noFilter, minScore: 9.0 });
        return r.every(p => p.score >= 9.0) && ids(r).join() === "1,2,7";
      })(),
      "IDs with score ≥ 9.0: 1(9.2), 2(9.5), 7(9.0) → 3 properties"
    ),

    // T09 — Combined: amenity + type + score (FR-4 / AC-4)
    assert(
      "Amenity=wifi AND Type=hotel AND Score≥8.5 → intersection",
      (() => {
        const r = filterProperties(properties, { amenities: ["wifi"], types: ["hotel"], minScore: 8.5 });
        return ids(r).join() === "1,5";
      })(),
      "Only Grand Horizon(id=1, 9.2) and Blue Bay(id=5, 8.9) match all three"
    ),

    // T10 — No results (FR-7 / AC-7)
    assert(
      "Impossible filter combo → 0 results",
      filterProperties(properties, { amenities: ["breakfast"], types: ["villa"], minScore: 9.6 }).length === 0,
      "Sunset Villa Retreat (id=2) has score=9.5 which is < 9.6; no villa+breakfast clears this bar"
    ),

    // T11 — Defensive defaults: missing amenities field (DD-02)
    assert(
      "Property with missing amenities field → no crash",
      (() => {
        const malformed = [{ id: 99, name: "Bad Hotel", type: "hotel", score: 8.0, price: 100 }];
        const r = filterProperties(malformed, { amenities: ["wifi"], types: [], minScore: 1 });
        return r.length === 0;
      })(),
      "amenities=undefined treated as [] → no match for wifi filter"
    ),

    // T12 — Defensive defaults: missing score field (DD-02)
    assert(
      "Property with missing score field → treated as 0",
      (() => {
        const malformed = [{ id: 99, name: "No Score Hotel", type: "hotel", amenities: [], price: 100 }];
        const r = filterProperties(malformed, { ...noFilter, minScore: 5 });
        return r.length === 0;
      })(),
      "score=undefined treated as 0 → filtered out when minScore=5"
    ),

    // T13 — Malformed record passes no-filter state — covers CR-5 gap (DD-02 + short-circuit path)
    assert(
      "Malformed record with no amenities/type passes all-off filter → returned without crash",
      (() => {
        const malformed = [{ id: 99, name: "Bad Hotel", score: 8.0, price: 100 }];
        const r = filterProperties(malformed, noFilter);
        return r.length === 1 && r[0].id === 99;
      })(),
      "amenities+type filters off → short-circuits to true; malformed record reaches caller (renderCards must guard too)"
    ),

  ];

  // ── Render results ────────────────────────────────────────────────────────
  const tbody   = document.getElementById("results");
  const summary = document.getElementById("summary");
  let passed = 0;

  tests.forEach((t, i) => {
    if (t.pass) passed++;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${t.description}</td>
      <td class="${t.pass ? 'pass' : 'fail'}">${t.pass ? "PASS" : "FAIL"}</td>
      <td><div class="detail">${t.detail}</div></td>
    `;
    tbody.appendChild(tr);
  });

  const total  = tests.length;
  const failed = total - passed;
  summary.textContent = `${passed}/${total} tests passed${failed ? ` — ${failed} FAILED` : " — all green"}`;
  summary.className   = `summary ${failed ? "fail-summary" : "pass-summary"}`;
</script>

</body>
</html>
